<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favorite</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #141E30, #243B55);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px;
}

.container {
    width: 900px;
    max-width: 100%;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.4);
}

h1 {
    text-align: center;
    color: white;
    margin-bottom: 20px;
    font-size: 40px;
}

#search {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 15px;
    outline: none;
    font-size: 18px;
    margin-bottom: 20px;
}

.inputBox {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.inputBox input {
    flex: 1;
    min-width: 200px;
    padding: 15px;
    border: none;
    border-radius: 15px;
    outline: none;
    font-size: 18px;
}

#addButton {
    width: 170px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    background: #4CAF50;
    color: white;
    font-size: 18px;
    transition: 0.3s;
}

#addButton:hover {
    transform: scale(1.05);
}

#line {
    width: 100%;
    height: 2px;
    background: white;
    opacity: 0.2;
    margin: 30px 0;
}

#list {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.card {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.25s;
    animation: show 0.25s;
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.35);
}

.left {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.top {
    display: flex;
    align-items: center;
    gap: 15px;
}

.icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    object-fit: contain;
}

.name {
    color: white;
    font-size: 24px;
    font-weight: bold;
}

.url {
    color: #cfcfcf;
    font-size: 15px;
    word-break: break-all;
}

.date {
    margin-top: 4px;
    font-size: 13px;
    color: #999;
}

.right {
    display: flex;
    gap: 10px;
}

button {
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
    font-size: 16px;
}

button:hover {
    transform: scale(1.08);
}

.open {
    padding: 12px 20px;
    background: #3f8cff;
    color: white;
}

.edit {
    background: #ff9800;
    color: white;
    padding: 12px 15px;
}

.delete {
    background: #e53935;
    color: white;
    padding: 12px 15px;
}

.pin {
    background: #ffd54f;
    padding: 12px;
}

.copy {
    background: #7E57C2;
    color: white;
    padding: 12px;
}

@keyframes show {
    from {
        opacity: 0;
        transform: translateY(-15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

#category {
    padding: 15px;
    border: none;
    border-radius: 15px;
    outline: none;
    font-size: 16px;
    cursor: pointer;
    background: white;
    color: #222;
}

.category {
    display: inline-block;
    width: fit-content;
    padding: 5px 10px;
    border-radius: 10px;
    background: rgba(63, 140, 255, 0.2);
    color: #8bb8ff;
    font-size: 13px;
    margin-top: 3px;
}
</style>
</head>
<body>

<div class="container">
    <h1>⭐ Favorite</h1>

    <input id="search" type="text" placeholder="🔍 Поиск...">

    <div class="inputBox">
    <input id="title" type="text" placeholder="Название сайта">
    <input id="link" type="text" placeholder="https://example.com">

    <select id="category">
        <option value="AI">🤖 AI</option>
        <option value="Игры">🎮 Игры</option>
        <option value="Учёба">📚 Учёба</option>
        <option value="Программирование">💻 Программирование</option>
        <option value="Другое">📁 Другое</option>
    </select>

    <button id="addButton">Добавить</button>
</div>
    <div id="line"></div>
    <div id="list"></div>
</div>

<script>
const titleInput = document.getElementById("title");
const linkInput = document.getElementById("link");
const addButton = document.getElementById("addButton");
const list = document.getElementById("list");
const search = document.getElementById("search");
const categoryInput = document.getElementById("category");

function normalizeUrl(url) {
    if (!/^https?:\/\//i.test(url)) {
        return "https://" + url;
    }
    return url;
}

addButton.onclick = function() {
const title = titleInput.value.trim();
let link = linkInput.value.trim();
const category = categoryInput.value;

    if (title === "" || link === "") {
        alert("Заполните все поля.");
        return;
    }

    link = normalizeUrl(link);
    const dateStr = "Добавлено: " + new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString();

    createCard(title, link, dateStr, category);
    saveCards();

    titleInput.value = "";
    linkInput.value = "";
};

function createCard(title, link, dateStr, category = "Другое") {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <div class="left">
            <div class="top">
                <img class="icon" alt="favicon">
                <div class="name"></div>
            </div>
            <div class="url"></div>
            <div class="category"></div>
            <div class="date"></div>
        </div>
        <div class="right">
            <button class="pin">⭐</button>
            <button class="open">Открыть</button>
            <button class="edit">✏</button>
            <button class="copy">📋</button>
            <button class="delete">🗑</button>
        </div>
    `;

    // Безопасная установка текста (защита от XSS)
    card.querySelector(".name").textContent = title;
    card.querySelector(".url").textContent = link;
    card.querySelector(".date").textContent = dateStr;
    card.querySelector(".category").textContent = category;

    updateFavicon(card.querySelector(".icon"), link);

    let currentLink = link;

    card.querySelector(".open").onclick = function() {
        window.open(currentLink, "_blank");
    };

    card.querySelector(".delete").onclick = function() {
        card.remove();
        saveCards();
    };

    card.querySelector(".pin").onclick = function() {
        list.prepend(card);
        saveCards();
    };

    card.querySelector(".copy").onclick = function() {
        navigator.clipboard.writeText(currentLink);
        alert("Ссылка скопирована!");
    };

    card.querySelector(".edit").onclick = function() {
        const newTitle = prompt("Новое название:", card.querySelector(".name").textContent);
        if (newTitle === null || newTitle.trim() === "") return;

        const rawLink = prompt("Новая ссылка:", currentLink);
        if (rawLink === null || rawLink.trim() === "") return;

        currentLink = normalizeUrl(rawLink.trim());

        card.querySelector(".name").textContent = newTitle.trim();
        card.querySelector(".url").textContent = currentLink;

        updateFavicon(card.querySelector(".icon"), currentLink);
        saveCards();
    };

    list.appendChild(card);
}

function updateFavicon(imgElement, url) {
    try {
        const domain = new URL(url).hostname;
        imgElement.src = "https://www.google.com/s2/favicons?domain=" + domain + "&sz=64";
    } catch {
        imgElement.src = "";
    }
}

function saveCards() {
    const data = [];
    document.querySelectorAll(".card").forEach(card => {
       data.push({
    title: card.querySelector(".name").textContent,
    link: card.querySelector(".url").textContent,
    category: card.querySelector(".category").textContent,
    date: card.querySelector(".date").textContent
        });
    });
    localStorage.setItem("favorites", JSON.stringify(data));
}

function loadCards() {
    const data = JSON.parse(localStorage.getItem("favorites")) || [];
    data.forEach(item => {
    createCard(
        item.title,
        item.link,
        item.date || "",
        item.category || "Другое"
    );
});
}

loadCards();

search.oninput = function() {
    const text = search.value.toLowerCase();
    document.querySelectorAll(".card").forEach(card => {
        const title = card.querySelector(".name").textContent.toLowerCase();
        const url = card.querySelector(".url").textContent.toLowerCase();
        
        if (title.includes(text) || url.includes(text)) {
            card.style.display = "flex";
        } else {
            card.style.display = "none";
        }
    });
};

[titleInput, linkInput].forEach(input => {
    input.addEventListener("keydown", function(e) {
        if (e.key === "Enter") addButton.click();
    });
});
</script>
</body>
</html>
